name: Build F-Droid and Play Flavors

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.flavor }} flavor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        flavor: [fdroid, play]

    steps:
    - uses: actions/checkout@v5
    - name: Checkout open-prayer-times
      uses: actions/checkout@v5
      with:
        repository: metinkale38/open-prayer-times
        ref: f44a7ed8fbf68ef9416eb4c487df8ea940adfed3
        path: open-prayer-times
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build ${{ matrix.flavor }} flavor
      run: bash ci_build.sh ${{ matrix.flavor }}
