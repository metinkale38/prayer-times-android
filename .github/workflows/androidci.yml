name: Build F-Droid and Play Flavors

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v5
    - name: Checkout open-prayer-times
      uses: actions/checkout@v5
      with:
        repository: metinkale38/open-prayer-times
        ref: 0378851c10cc0a188908d93ea2dbb75fec6e9546
        path: open-prayer-times
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build both flavors
      run: bash ci_build.sh
