name: Create version tag

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

concurrency:
  group: create-version-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create version tag
        run: bash .github/scripts/create-version-tag.sh
