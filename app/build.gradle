plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id("com.google.devtools.ksp")
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}


android {

    namespace "com.metinkale.prayer"

    sourceSets {
        main.assets.srcDirs += ['../changelogs']
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', '.readme', 'META-INF/LICENSE-LGPL-2.1.txt', 'META-INF/LICENSE-LGPL-3.txt', 'META-INF/LICENSE-W3C-TEST', 'META-INF/DEPENDENCIES']
        }
    }

    defaultConfig {
        targetSdkVersion 36
        compileSdk 36
        applicationId "com.metinkale.prayer"
        minSdkVersion 26
        multiDexEnabled true
        versionName '3.8.4'
        versionCode 256
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        vectorDrawables.useSupportLibrary = true
        buildConfigField 'int', 'CHANGELOG_VERSION', '20'
    }

    buildTypes {
        debug {
            versionNameSuffix ' DEBUG'
            minifyEnabled false
            shrinkResources false
            resValue "string", "FILE_PROVIDER_AUTHORITIES", "com.metinkale.prayer.debug.fileprovider"
            manifestPlaceholders = [sentryDebug: "true"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "FILE_PROVIDER_AUTHORITIES", "com.metinkale.prayer.fileprovider"
            manifestPlaceholders = [sentryDebug: "false"]
        }
    }

    flavorDimensions = ["store"]
    productFlavors {
        fdroid {
            dimension "store"
        }
        play {
            versionNameSuffix " Play Store"
            dimension "store"
            isDefault = true
        }
    }

    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }


    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
    }
    buildFeatures {
        buildConfig true
        resValues true
    }


}


dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'

    // times
    implementation 'androidx.media:media:1.7.0'
    api 'dev.metinkale:openprayertimes:1.0-SNAPSHOT'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.23'

    // compose
    def composeBom = platform('androidx.compose:compose-bom:2025.01.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.6"
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation 'androidx.documentfile:documentfile:1.0.1'

    debugImplementation "androidx.compose.ui:ui-tooling:1.7.6"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // intro
    implementation 'com.vladsch.flexmark:flexmark:0.64.0'
    // about
    implementation('com.mikepenz:aboutlibraries:7.1.0@aar') { transitive = true }
// TODO needs update
    //dhikr
    def room_version = "2.8.4"
    api "androidx.lifecycle:lifecycle-extensions:2.2.0"
    api "androidx.lifecycle:lifecycle-common-java8:2.10.0"
    api "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    // compass
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'
    // TODO consider replacing with WebView to reduce dependencies
    playImplementation 'com.google.android.gms:play-services-maps:19.2.0'
    playImplementation 'com.google.android.gms:play-services-gcm:17.0.0'
    playImplementation 'com.google.android.gms:play-services-location:21.3.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'


    // base

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.13.0-alpha09'
    implementation 'com.koushikdutta.ion:ion:3.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.fragment:fragment-ktx:1.8.5"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"
    implementation "androidx.lifecycle:lifecycle-service:2.8.7"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'io.sentry:sentry-android:8.+'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    testImplementation "io.kotest:kotest-runner-junit5:5.6.2"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testImplementation "io.mockk:mockk:1.4.1"
}


apply from: 'aliases.gradle.kts'