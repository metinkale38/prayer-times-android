plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id("com.google.devtools.ksp")
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}


android {

    namespace "com.metinkale.prayer"

    sourceSets {
        main.assets.srcDirs += ['../changelogs']
        main.res.srcDirs += 'src/main/translations'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', '.readme', 'META-INF/LICENSE-LGPL-2.1.txt', 'META-INF/LICENSE-LGPL-3.txt', 'META-INF/LICENSE-W3C-TEST', 'META-INF/DEPENDENCIES']
        }
    }

    defaultConfig {
        targetSdkVersion 37
        compileSdk 37
        applicationId "com.metinkale.prayer"
        minSdkVersion 26
        multiDexEnabled true
        versionName '3.9.0'
        versionCode 256
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: 'true'
        vectorDrawables.useSupportLibrary = true
        buildConfigField 'int', 'CHANGELOG_VERSION', '21'
    }

    buildTypes {
        debug {
            versionNameSuffix ' DEBUG'
            minifyEnabled false
            shrinkResources false
            resValue "string", "FILE_PROVIDER_AUTHORITIES", "com.metinkale.prayer.debug.fileprovider"
            manifestPlaceholders = [sentryDebug: "true"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "FILE_PROVIDER_AUTHORITIES", "com.metinkale.prayer.fileprovider"
            manifestPlaceholders = [sentryDebug: "false"]
        }
    }

    flavorDimensions = ["store"]
    productFlavors {
        fdroid {
            dimension "store"
        }
        play {
            versionNameSuffix " Play Store"
            dimension "store"
            isDefault = true
        }
    }

    bundle {
        language {
            // Specifies that the app bundle should not support
            // configuration APKs for language resources. These
            // resources are instead packaged with each base and
            // dynamic feature APK.
            enableSplit = false
        }
    }


    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        // Sets Java compatibility to Java 8
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
    }
    buildFeatures {
        buildConfig true
        resValues true
    }


}


dependencies {
    implementation 'dev.metinkale:open-prayer-times-client:1.0-SNAPSHOT'
    implementation 'dev.metinkale:calctimes:1.0-SNAPSHOT'
    implementation 'dev.metinkale:hijri:1.0-SNAPSHOT'

    implementation("io.ktor:ktor-client-cio:3.5.2")
    implementation("io.ktor:ktor-client-core:3.5.2")
    implementation("io.ktor:ktor-client-logging:3.5.2")
    implementation("io.ktor:ktor-client-content-negotiation:3.5.2")
    implementation("io.ktor:ktor-serialization-kotlinx-json:3.5.2")
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.8.0")


    implementation 'io.sentry:sentry-android:8.51.0'
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'
    // TODO needs update
    implementation('com.mikepenz:aboutlibraries:7.1.0@aar') { transitive = true }
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'
    implementation 'com.koushikdutta.ion:ion:3.1.0'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.3.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

// --- Compose ---
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.11.4'
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.11.4'

// --- Lifecycle ---
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'

// --- Room ---
    implementation 'androidx.room:room-runtime:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

// --- AndroidX & Google Jetpack ---
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.percentlayout:percentlayout:1.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.browser:browser:1.10.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.media:media:1.8.0'

    implementation 'com.google.android.material:material:1.14.0'
    playImplementation 'com.google.android.gms:play-services-maps:20.0.0'
    playImplementation 'com.google.android.gms:play-services-gcm:17.0.0'
    playImplementation 'com.google.android.gms:play-services-location:21.4.0'


    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation "io.kotest:kotest-runner-junit5:6.2.3"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.2'
    testImplementation "io.mockk:mockk:1.14.11"

    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'

}


apply from: 'aliases.gradle.kts'