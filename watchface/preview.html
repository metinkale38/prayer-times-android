<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"/>
<title>Gebetszeiten Zifferblatt – Vorschau</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #050505; color: #f2f2f2; font: 14px/1.4 Roboto, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; }
  canvas { width: 450px; height: 450px; border-radius: 50%; }
  .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 16px; width: 450px; }
  label { display: flex; flex-direction: column; gap: 4px; color: #a9b0b4; font-size: 12px; }
  input[type=time], input[type=range] { width: 100%; }
  .wide { grid-column: 1 / -1; }
  .row { display: flex; align-items: center; gap: 8px; color: #a9b0b4; }
  .value { color: #f2f2f2; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="dial" width="450" height="450"></canvas>
<div class="controls">
  <label class="wide">Uhrzeit <span class="value" id="timeLabel"></span>
    <input id="time" type="range" min="0" max="1439" step="1" value="810"/>
  </label>
  <label>Fajr <input id="fajr" type="time" value="04:30"/></label>
  <label>Sonne <input id="sun" type="time" value="06:10"/></label>
  <label>Zuhr <input id="dhuhr" type="time" value="13:15"/></label>
  <label>Asr <input id="asr" type="time" value="17:00"/></label>
  <label>Maghrib <input id="maghrib" type="time" value="19:45"/></label>
  <label>Ishaa <input id="ishaa" type="time" value="21:15"/></label>
  <div class="row wide"><input id="ambient" type="checkbox"/><label for="ambient" style="flex-direction: row; gap: 6px;">Ambient</label></div>
</div>
<script>
const W = 450, C = W / 2;
const RING_R = 0.455 * W, RING_STROKE = 10, GAP = 4;
const LABEL_R = 188, LABEL_SIZE = 11;
const COLORS = {
  background: "#000000",
  primary: "#f2f2f2",
  secondary: "#d2d6d8",
  accent: "#3f9bbf",
  past: "#6a7074",
  future: "#33373a"
};

const canvas = document.getElementById("dial");
const ctx = canvas.getContext("2d");

const params = new URLSearchParams(location.search);
const state = {
  now: params.has("min") ? Number(params.get("min")) : 810,
  ambient: params.get("ambient") === "1",
  times: {
    fajr: params.get("fajr") || "04:30",
    sun: params.get("sun") || "06:10",
    dhuhr: params.get("dhuhr") || "13:15",
    asr: params.get("asr") || "17:00",
    maghrib: params.get("maghrib") || "19:45",
    ishaa: params.get("ishaa") || "21:15"
  }
};

const ORDER = ["fajr", "sun", "dhuhr", "asr", "maghrib", "ishaa"];
const NAMES = { fajr: "Fajr", sun: "Sonne", dhuhr: "Zuhr", asr: "Asr", maghrib: "Maghrib", ishaa: "Ishaa" };

function minutes(value) {
  const [h, m] = value.split(":").map(Number);
  return h * 60 + (m || 0);
}

function clock(value) {
  const h = Math.floor(value / 60) % 24;
  const m = Math.round(value % 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

function geometry() {
  const t = {};
  ORDER.forEach(k => t[k] = minutes(state.times[k]));
  const nextFajr = t.fajr + 1440;
  const anchor = (t.maghrib + nextFajr) / 2;
  const startS = (anchor - 1440) * 60;
  const noonS = t.dhuhr * 60;
  const endS = anchor * 60;
  const angleOf = (minutesOfDay) => {
    const s = minutesOfDay * 60;
    return s < noonS
      ? 180 * (s - startS) / (noonS - startS)
      : 180 + 180 * (s - noonS) / (endS - noonS);
  };
  return { t, nextFajr, anchor, startS, noonS, endS, angleOf };
}

function draw() {
  const g = geometry();
  const ambient = state.ambient;
  const now = state.now;

  ctx.clearRect(0, 0, W, W);
  ctx.fillStyle = COLORS.background;
  ctx.fillRect(0, 0, W, W);
  ctx.lineCap = "butt";
  ctx.lineWidth = RING_STROKE;

  const arcs = [];
  const anchor = g.anchor;
  arcs.push({ start: 0, end: g.angleOf(g.t.fajr), from: anchor - 1440, to: g.t.fajr });
  ORDER.forEach((key, index) => {
    const start = g.angleOf(g.t[key]) + GAP;
    const end = index === ORDER.length - 1 ? 360 : g.angleOf(g.t[ORDER[index + 1]]);
    const from = g.t[key];
    const to = index === ORDER.length - 1 ? anchor : g.t[ORDER[index + 1]];
    arcs.push({ start, end, from, to });
  });

  ctx.globalAlpha = ambient ? 0.6 : 1;
  // Zukuenftig (dunkel), vergangen (hell), aktiv (teal) - wie im Zifferblatt.
  arcs.forEach(a => strokeArc(a.start, a.end, COLORS.future));
  arcs.forEach(a => {
    const fraction = Math.min(1, Math.max(0, (now - a.from) / (a.to - a.from)));
    if (fraction <= 0) return;
    strokeArc(a.start, a.start + (a.end - a.start) * fraction, COLORS.past);
  });
  const nightActive = now >= g.t.ishaa || now < g.t.fajr;
  arcs.forEach((a, index) => {
    const isNight = index === 0 || index === arcs.length - 1;
    const active = isNight ? nightActive : (now >= a.from && now < a.to);
    if (!active) return;
    strokeArc(a.start, a.end, COLORS.accent);
  });
  ctx.globalAlpha = 1;

  ORDER.forEach(key => {
    const start = g.angleOf(g.t[key]) + GAP;
    const upper = start < 90 || start >= 270;
    ctx.globalAlpha = ambient ? 0.8 : 1;
    drawCircular([{ text: NAMES[key], color: "#8e9499" }, { text: " " + state.times[key], color: "#e0e4e6" }],
                 start, LABEL_R, LABEL_SIZE, upper);
    ctx.globalAlpha = 1;
  });

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.globalAlpha = ambient ? 0.9 : 1;
  ctx.fillStyle = COLORS.primary;
  ctx.font = "bold 100px Roboto, system-ui, sans-serif";
  ctx.fillText(clock(now), C, 188);
  ctx.globalAlpha = 1;

  if (!ambient) {
    const date = new Date(2026, 3, 16);
    const dateText = date.toLocaleDateString("de-DE", { weekday: "short", day: "numeric", month: "long", year: "numeric" });
    ctx.fillStyle = COLORS.primary;
    ctx.font = "18px Roboto, system-ui, sans-serif";
    ctx.fillText(dateText.replace(/^(\w+)\.?,?/, "$1,"), C, 112);

    ctx.fillStyle = COLORS.accent;
    ctx.font = "22px Roboto, system-ui, sans-serif";
    ctx.fillText("28 Shawwal 1447", C, 255);

    const nextIndex = ORDER.findIndex(k => g.t[k] > now);
    const nextKey = nextIndex < 0 ? "fajr" : ORDER[nextIndex];
    const currentKey = nextIndex <= 0 ? "ishaa" : ORDER[nextIndex - 1];
    const target = nextIndex < 0 ? g.nextFajr : g.t[nextKey];
    const remaining = Math.max(0, target - now);
    const countdown = clock(remaining);
    const label = NAMES[currentKey] + " | ";
    const suffix = " bis " + NAMES[nextKey];
    ctx.textAlign = "left";
    ctx.font = "bold 20px Roboto, system-ui, sans-serif";
    const labelW = ctx.measureText(label).width;
    ctx.font = "20px Roboto, system-ui, sans-serif";
    const timeW = ctx.measureText(countdown).width;
    const suffixW = ctx.measureText(suffix).width;
    const left = C - (labelW + timeW + suffixW) / 2;
    ctx.fillStyle = COLORS.primary;
    ctx.font = "bold 20px Roboto, system-ui, sans-serif";
    ctx.fillText(label, left, 286);
    ctx.font = "20px Roboto, system-ui, sans-serif";
    ctx.fillText(countdown, left + labelW, 286);
    ctx.fillStyle = "#7a7d82";
    ctx.fillText(suffix, left + labelW + timeW, 286);
    ctx.textAlign = "center";

    drawWeather();
    drawGoals();
    drawSteps();
  }
}

function strokeArc(start, end, color) {
  if (end - start <= 0.01) return;
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.arc(C, C, RING_R, (start - 90) * Math.PI / 180, (end - 90) * Math.PI / 180);
  ctx.stroke();
}

function drawCircular(parts, startAngle, radius, size, clockwise) {
  const chars = [];
  parts.forEach(part => [...part.text].forEach(ch => chars.push({ ch, color: part.color })));
  ctx.font = size + "px Roboto, system-ui, sans-serif";
  const widths = chars.map(c => Math.max(ctx.measureText(c.ch).width, 0.1));
  const degPerPx = 180 / (Math.PI * radius);
  const total = widths.reduce((a, b) => a + b, 0) * degPerPx;
  let cursor = clockwise ? startAngle : startAngle + total;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  chars.forEach((c, i) => {
    const wDeg = widths[i] * degPerPx;
    const center = clockwise ? cursor + wDeg / 2 : cursor - wDeg / 2;
    cursor += clockwise ? wDeg : -wDeg;
    ctx.fillStyle = c.color;
    const rad = (center - 90) * Math.PI / 180;
    const x = C + radius * Math.cos(rad);
    const y = C + radius * Math.sin(rad);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((clockwise ? center : center + 180) * Math.PI / 180);
    ctx.fillText(c.ch, 0, 0);
    ctx.restore();
  });
}

function drawLabel(text, angle, radius, size, color, rotation) {
  const rad = (angle - 90) * Math.PI / 180;
  const x = C + radius * Math.cos(rad);
  const y = C + radius * Math.sin(rad);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.fillStyle = color;
  ctx.font = size + "px Roboto, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function drawWeather() {
  ctx.fillStyle = COLORS.accent;
  ctx.font = "20px Roboto, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("32°", C, 74);
}

function drawGoals() {
  [173, 225, 277].forEach(cx => {
    ctx.lineWidth = 4;
    ctx.strokeStyle = COLORS.track;
    ctx.beginPath();
    ctx.arc(cx, 331, 25, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = COLORS.accent;
    ctx.beginPath();
    ctx.arc(cx, 331, 25, -Math.PI / 2, Math.PI * 1.5);
    ctx.stroke();
    ctx.fillStyle = COLORS.primary;
    ctx.font = "14px Roboto, system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("100%", cx, 331);
  });
}

function drawSteps() {
  ctx.font = "20px Roboto, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const number = "1000";
  const word = " Schritte";
  const numberWidth = ctx.measureText(number).width;
  const wordWidth = ctx.measureText(word).width;
  const left = C - (numberWidth + wordWidth) / 2;
  ctx.textAlign = "left";
  ctx.fillStyle = COLORS.primary;
  ctx.fillText(number, left, 372);
  ctx.fillStyle = COLORS.secondary;
  ctx.fillText(word, left + numberWidth, 372);
}

function bind() {
  const timeInput = document.getElementById("time");
  const ambientInput = document.getElementById("ambient");
  const timeLabel = document.getElementById("timeLabel");
  timeInput.value = state.now;
  ambientInput.checked = state.ambient;
  ORDER.forEach(key => document.getElementById(key).value = state.times[key]);
  const refresh = () => {
    state.now = Number(timeInput.value);
    state.ambient = ambientInput.checked;
    ORDER.forEach(key => state.times[key] = document.getElementById(key).value || state.times[key]);
    timeLabel.textContent = clock(state.now);
    draw();
  };
  timeInput.addEventListener("input", refresh);
  ambientInput.addEventListener("change", refresh);
  ORDER.forEach(key => document.getElementById(key).addEventListener("input", refresh));
  timeLabel.textContent = clock(state.now);
  draw();
}

document.fonts.ready.then(bind);
</script>
</body>
</html>
