plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.metinkale.prayer.wear'
    compileSdk 37

    sourceSets {
        main.res.srcDirs += 'src/main/translations'
    }

    defaultConfig {
        applicationId 'com.metinkale.prayer'
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':sync')

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.wear.compose:compose-material3:1.7.1'
    implementation 'dev.metinkale:hijri:1.0-SNAPSHOT'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.7.1'
    implementation 'androidx.wear.compose:compose-foundation:1.7.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.datastore:datastore:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.maps.android:maps-compose:9.0.1'
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
}
