plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.metinkale.prayer.wear'
    compileSdk 37

    sourceSets {
        main.res.srcDirs += 'src/main/translations'
    }

    defaultConfig {
        applicationId 'com.metinkale.prayer'
        minSdk 30
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.all {
            it.useJUnitPlatform()
        }
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation project(':sync')

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.wear.compose:compose-material3:1.7.1'
    implementation 'dev.metinkale:hijri:1.0-SNAPSHOT'
    implementation 'org.jetbrains.kotlinx:kotlinx-datetime:0.7.1'
    implementation 'androidx.wear.compose:compose-foundation:1.7.1'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.datastore:datastore:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.maps.android:maps-compose:9.0.1'
    implementation 'com.google.android.gms:play-services-maps:20.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'
    implementation 'androidx.wear.protolayout:protolayout:1.4.2'
    implementation 'androidx.wear.protolayout:protolayout-material3:1.4.2'
    implementation 'androidx.wear.watchface:watchface:1.3.0-alpha07'
    implementation 'androidx.wear.watchface:watchface-complications:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-data:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-rendering:1.3.0-alpha07'
    implementation 'com.google.android.wearable:wearable:2.9.0'
    implementation 'com.google.guava:guava:33.4.8-android'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}
